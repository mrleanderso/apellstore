name: APELL - quality checks
on:
  push:
    branches: [main]
    paths: ['index.html', 'js/**', 'css/**', 'data/**', 'p/**', 'scripts/**', 'manifest.webmanifest', 'sw.js', 'offline.html', 'install.html', 'icons/**', '.github/workflows/apell-quality.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test scripts/*.test.mjs
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node scripts/browser-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apell-browser-audit
          path: audit-results/
          if-no-files-found: ignore
